name: Windows Defense v0.6 checks

on:
  push:
    branches:
      - windows-defense-v6
  pull_request:
    branches:
      - windows-defense-v6
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-defense-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-static-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run Windows PowerShell 5.1 self-test
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          .\tools\windows-defense-v6\Test-WindowsDefense-v0.6.ps1
