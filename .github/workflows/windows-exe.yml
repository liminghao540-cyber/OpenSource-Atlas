name: Windows EXE

on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-exe.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-exe.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Compile-check defense launcher
        run: python -m py_compile packaging/windows/defense_launcher.py
      - name: Build repository dashboard executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name OpenSourceAtlas --collect-submodules opensource_atlas packaging/windows/launcher.py
      - name: Upload repository dashboard executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourceAtlas-Windows-10-x64
          path: dist/OpenSourceAtlas.exe
          if-no-files-found: error
          retention-days: 14
      - name: Build dedicated Windows Defense executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name OpenSourceAtlasDefense --collect-submodules opensource_atlas packaging/windows/defense_launcher.py
      - name: Upload Windows Defense executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourceAtlas-Defense-Windows-10-x64
          path: dist/OpenSourceAtlasDefense.exe
          if-no-files-found: error
          retention-days: 14
      - name: Assemble BAT launcher bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/bat-bundle/src/opensource_atlas | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bat-bundle/packaging/windows | Out-Null
          Copy-Item Start-WindowsDefense-V8.0.5.bat dist/bat-bundle/
          Copy-Item packaging/windows/defense_launcher.py dist/bat-bundle/packaging/windows/
          Copy-Item src/opensource_atlas/*.py dist/bat-bundle/src/opensource_atlas/
          Compress-Archive -Path dist/bat-bundle/* -DestinationPath dist/OpenSourceAtlas-Defense-BAT.zip -Force
      - name: Upload BAT launcher bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourceAtlas-Defense-BAT-Windows-10
          path: dist/OpenSourceAtlas-Defense-BAT.zip
          if-no-files-found: error
          retention-days: 14
