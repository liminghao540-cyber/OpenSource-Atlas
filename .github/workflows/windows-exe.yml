name: Windows EXE

on:
  pull_request:
    paths:
      - "src/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-exe.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/windows/**"
      - ".github/workflows/windows-exe.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build standalone executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name OpenSourceAtlas --collect-submodules opensource_atlas packaging/windows/launcher.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourceAtlas-Windows-10-x64
          path: dist/OpenSourceAtlas.exe
          if-no-files-found: error
          retention-days: 14
