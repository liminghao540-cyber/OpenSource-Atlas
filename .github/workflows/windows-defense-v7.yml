name: Windows Defense v0.7 checks

on:
  push:
    branches: [windows-defense-v7]
  pull_request:
    branches: [windows-defense-v7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-defense-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-static-checks:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run v0.7 syntax and safety tests
        shell: pwsh
        run: ./tools/windows-defense-v7/Test-WindowsDefense-v0.7.ps1
